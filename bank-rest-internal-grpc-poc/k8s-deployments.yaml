# 1. External Bank API Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-bank-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-bank-api
  template:
    metadata:
      labels:
        app: external-bank-api
    spec:
      containers:
      - name: bank-api
        image: external-bank-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: external-bank-api
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: external-bank-api
---
# 2. Internal Gateway gRPC Service Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
      - name: gateway
        image: gateway-service:latest
        imagePullPolicy: Never
        env:
        - name: PORT
          value: "3003"
        - name: BANK_REST_URL
          value: "http://external-bank-api.default.svc.cluster.local:8080"
        ports:
        - containerPort: 3003
        volumeMounts:
        - name: certs-vol
          mountPath: /app/certs
          readOnly: true
      volumes:
      - name: certs-vol
        secret:
          secretName: mtls-certs
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: default
spec:
  type: ClusterIP
  ports:
  - port: 3003
    targetPort: 3003
    name: grpc
  selector:
    app: gateway-service