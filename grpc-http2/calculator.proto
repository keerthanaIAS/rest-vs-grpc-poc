
syntax = "proto3";

package calculator;

service Calculator {
  // Unary: one request, one response
  rpc Add(AddRequest) returns (AddResponse);

  // Server streaming: one request, many responses
  rpc CountUp(CountUpRequest) returns (stream CountUpResponse);

  // Client streaming: many requests, one response
  rpc Sum(stream NumberRequest) returns (SumResponse);

  // Bidirectional streaming: many requests, many responses
  rpc RunningSum(stream NumberRequest) returns (stream SumResponse);
}

message AddRequest {
  double a = 1;
  double b = 2;
}

message AddResponse {
  double result = 1;
}

message CountUpRequest {
  int32 start = 1;
  int32 end = 2;
}

message CountUpResponse {
  int32 number = 1;
}

message NumberRequest {
  double number = 1;
}

message SumResponse {
  double result = 1;
}