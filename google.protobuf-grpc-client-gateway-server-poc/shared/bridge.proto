syntax = "proto3";

package bridge;

import "google/protobuf/struct.proto";

service ApiBridge {
  rpc Forward(GenericRequest) returns (GenericResponse);
}

message GenericRequest {
  google.protobuf.Struct data = 1;
}

message GenericResponse {
  int32 status = 1;
  google.protobuf.Struct data = 2;
}